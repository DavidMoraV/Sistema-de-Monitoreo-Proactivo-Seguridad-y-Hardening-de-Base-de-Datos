# =====================================================================
#  NutriAnimales S.A. — Sistema de Monitoreo, Seguridad y Hardening de BD
#  BCD 9220 · Lead University · III Cuatrimestre 2026
#
#  Hardening aplicado en este archivo:
#    HD01  Usuario no-root en N8N           (user: "1000:1000")
#    HD02  Secretos en .env (chmod 600)     (solo se interpolan las variables necesarias)
#    HD03  Red Docker aislada               (nutrianimales-net)
#    HD04  PostgreSQL sin puerto expuesto   (sin "ports:" en postgres; solo Nginx publica)
#    HD05  scram-sha-256                    (POSTGRES_INITDB_ARGS)
#    HD06  SSL/TLS en PostgreSQL            (ssl=on + certificado en certs/postgres)
#    HD11  Logs de consultas lentas         (log_min_duration_statement=1000)
# =====================================================================

services:

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    container_name: nutri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"      # HD05
      TZ: ${GENERIC_TIMEZONE}
      # Contraseñas que usa sql/05_rbac.sh al crear los usuarios (solo en la primera inicialización)
      AGENTE_IA_PASSWORD: ${AGENTE_IA_PASSWORD}
      MONITOR_N8N_PASSWORD: ${MONITOR_N8N_PASSWORD}
      GERENTE_DB_PASSWORD: ${GERENTE_DB_PASSWORD}
      TI_DB_PASSWORD: ${TI_DB_PASSWORD}
      AUDITOR_DB_PASSWORD: ${AUDITOR_DB_PASSWORD}
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
      -c password_encryption=scram-sha-256
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c logging_collector=on
      -c log_directory=log
      -c log_line_prefix='%m [%p] %u@%d %h '
      -c timezone=${GENERIC_TIMEZONE}
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./certs/postgres:/certs:ro
    networks:
      - nutrianimales-net
    # HD04: SIN "ports:". PostgreSQL solo es accesible dentro de nutrianimales-net.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- N8N
  n8n:
    image: n8nio/n8n:2.45.5          # versión fija: el ZIP final siempre levanta igual
    container_name: nutri_n8n
    restart: unless-stopped
    user: "1000:1000"                # HD01: usuario no-root
    environment:
      N8N_HOST: ${SERVIDOR_IP}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${SERVIDOR_IP}:8443/
      WEBHOOK_URL: https://${SERVIDOR_IP}:8443/
      N8N_PROXY_HOPS: 1
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"     # la credencial de Groq lee $env.GROQ_API_KEY (rotación 6.1)
      N8N_LOG_LEVEL: info
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      # Secretos que consumen los flujos (no se pasa POSTGRES_PASSWORD: mínimo privilegio)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./volumes/n8n:/home/node/.n8n
    networks:
      - nutrianimales-net
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------- Nginx (único punto de entrada)
  nginx:
    image: nginx:1.27-alpine
    container_name: nutri_nginx
    restart: unless-stopped
    ports:
      - "8080:80"                    # redirige a HTTPS
      - "8443:443"                   # HTTPS → N8N
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - nutrianimales-net
    depends_on:
      - n8n

# ------------------------------------------------------------------ Red aislada (HD03)
networks:
  nutrianimales-net:
    name: nutrianimales-net          # nombre fijo (sin prefijo del proyecto) para "docker network inspect"
    driver: bridge
