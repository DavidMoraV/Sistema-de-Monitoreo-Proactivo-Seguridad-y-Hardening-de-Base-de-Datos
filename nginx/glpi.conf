# =====================================================================
#  Nginx — proxy inverso HTTPS hacia GLPI (Proyecto II)
#  Mismo criterio del Proyecto I: Nginx es el único punto de entrada y todo va cifrado.
#  GLPI no publica puertos; Nginx lo expone en el 8444 del host (HD08 y HD09).
#  Lo monta docker-compose.glpi.yml; nginx.conf (N8N, 8443) no se modifica.
# =====================================================================
server {
    listen 8444 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    # HTTP enviado por error al puerto HTTPS → redirigir a https
    error_page 497 =301 https://$host:8444$request_uri;

    # ---- Headers de seguridad (HD08) ----
    # SAMEORIGIN y no DENY: GLPI usa iframes propios en algunas ventanas.
    # Sin CSP: GLPI 10 depende de scripts en línea y una CSP estricta rompe la interfaz.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;            # adjuntos de tickets

    # Resolución diferida: si GLPI está apagado, Nginx igual arranca y N8N (8443) sigue disponible.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $glpi_upstream http://glpi:80;

    location / {
        proxy_pass $glpi_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8444;
    }
}
