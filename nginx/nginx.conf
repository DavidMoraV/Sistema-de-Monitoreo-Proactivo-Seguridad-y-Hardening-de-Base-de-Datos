# =====================================================================
#  Nginx — proxy inverso HTTPS hacia N8N
#  HD08 Headers de seguridad · HD09 Certificado SSL
# =====================================================================

# HTTP (8080 en el host) → redirección permanente a HTTPS (8443 en el host)
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# HTTPS (8443 en el host)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;                       # no revelar la versión de Nginx

    # ---- HD08: headers de seguridad ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El editor de N8N necesita scripts y estilos en línea; se restringe todo lo demás al propio origen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;

        # WebSockets / SSE del editor de N8N
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
